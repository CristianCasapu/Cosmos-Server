<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="expires" content="0">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cosmos</title>
    <link rel="icon" type="image/x-icon" href="/src/assets/images/icons/logo2.png">
    <!-- Fork addition: the panel as an installable app (client/sw/, src/fork_pwa.go).
         viewport-fit=cover hands the notch and the home indicator to the skin's
         --ct-safe-* (theme.css); mode.js keeps theme-color and the iOS status bar
         in step with the mode the user chose. -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0a0f1d" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f2f5fa" media="(prefers-color-scheme: light)">
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Cosmos">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
      @media (prefers-color-scheme: dark) {
        html {
          background-color: #141414;
        }
      }
    </style>
    <!-- Fork skin. The boot style paints the background before theme.css arrives;
         mode.js is a classic script so it runs before the app module and can
         decide the colour mode Cosmos starts in. -->
    <style id="ct-boot">html{background-color:#0a0f1d !important}html[data-ct-mode="light"]{background-color:#f2f5fa !important}@media (prefers-color-scheme: light){html:not([data-ct-mode]){background-color:#f2f5fa !important}}</style>
    <script id="ct-mode" src="/skin/mode.js?v=__SKIN_VERSION__"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
    <!-- Last in <body>, after the styles the app injects into <head>, so that
         equal-specificity rules in the skin win. -->
    <link rel="stylesheet" id="ct-theme" href="/skin/theme.css?v=__SKIN_VERSION__">
  </body>
</html>
