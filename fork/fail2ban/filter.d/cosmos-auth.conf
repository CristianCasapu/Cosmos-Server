# Fail2ban filter of the Cosmos fork: guessing credentials (logins, two-factor codes, password confirmation, invitation keys, API tokens)
#
# Reads cosmos.security.log, the file Cosmos writes for Fail2ban:
#   2026-11-13T10:22:01+0200 cosmos-security kind=auth.login.failed ip=203.0.113.7 sev=medium n=1
# Nothing on such a line comes from a request except the address, which is
# written in the address parser's own form. The expression is anchored on
# both ends and accepts addresses only (<ADDR>, never a host name).
#
# The kinds this jail counts are the alternatives after "kind=": to count
# another kind, add it there (dots escaped) and run
#   fail2ban-regex /var/lib/cosmos/cosmos.security.log /etc/fail2ban/filter.d/cosmos-auth.conf
# Installed by fork/fail2ban/install.sh; replaced when that is run again.

[Definition]
datepattern = {^LN-BEG}%%Y-%%m-%%dT%%H:%%M:%%S%%z
failregex = ^\s*cosmos-security kind=(?:auth\.login\.failed|auth\.register\.failed|auth\.mfa\.failed|auth\.mfa\.locked|auth\.sudo\.failed|token\.invalid) ip=<ADDR> sev=[a-z]+ n=\d+$
ignoreregex =
