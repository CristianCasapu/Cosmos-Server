# Fork addition: everything that must hold before a commit may be released:
# the UI builds, the fork's tests pass, the server and launcher build, and the
# built server starts and serves the UI. Used by the checks on `custom`, by the
# upstream sync (on its merge candidate) and by the release itself.
#
# The build runs third-party code (npm and Go dependencies), so this action
# takes no token and its callers check out without leaving one on disk.
name: Build and verify the fork
description: Build the UI, the server and the launcher, run the fork's tests and start the build once

inputs:
  version:
    description: Fork version to stamp into the build (empty for a build that is not released)
    required: false
    default: ''
  build:
    description: Fork build number shown in the UI (empty for a build that is not released)
    required: false
    default: ''
  release:
    description: "'true' for a build that will be released: it must carry a release key (src/forkrelease/keys.go)"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # A release build restores no cache: runs on custom execute the
    # dependencies' code and write the default branch's cache, which
    # production may restore (cache poisoning). Checks keep the cache.
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: ${{ inputs.release != 'true' }}

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        cache: ${{ inputs.release != 'true' && 'npm' || '' }}

    # GeoLite2 is not in the repository; upstream's CI downloads it (it
    # needs a MaxMind key). Take the file upstream shipped for the version
    # this commit is based on.
    - name: Fetch the GeoLite2 database from the upstream release
      shell: bash
      env:
        UPSTREAM_REPO: azukaar/cosmos-server
      run: |
        upstream=$(jq -r .version package.json)
        if ! [[ "$upstream" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::package.json has version '$upstream', not a stable upstream x.y.z"; exit 1
        fi
        base="https://github.com/$UPSTREAM_REPO/releases/download/v$upstream"
        mkdir upstream
        zip="cosmos-cloud-$upstream-amd64.zip"
        curl -fsSL --retry 3 -o "upstream/$zip" "$base/$zip"
        curl -fsSL --retry 3 -o "upstream/$zip.md5" "$base/$zip.md5"
        want=$(awk 'NR==1{print $1}' "upstream/$zip.md5")
        have=$(md5sum "upstream/$zip" | awk '{print $1}')
        if [ -z "$want" ] || [ "$want" != "$have" ]; then
          echo "::error::$zip does not match the checksum upstream published"; exit 1
        fi
        unzip -q "upstream/$zip" -d upstream/amd64
        cp "upstream/amd64/cosmos-cloud-$upstream/GeoLite2-Country.mmdb" .
        rm -rf upstream

    # Nebula (Constellation) and restic (backups) from the projects' own
    # releases, each file checked against a SHA-256 pinned here (restic's
    # checksum list is signed with the key CF8F18F2844575973F79D4E191A6868BD3F7A907;
    # Nebula publishes SHASUM256.txt). Nebula stays on 1.9: from 1.10 on,
    # nebula-cert prints its JSON as a list and signs v2 certificates by
    # default, which Constellation's code does not read. restic stays on
    # 0.18: 0.19 stops with an error when neither HOME nor XDG_CACHE_HOME
    # is set, which is how a server installed as a system service runs it.
    - name: Fetch Nebula and restic from their own releases
      shell: bash
      env:
        NEBULA_VERSION: v1.9.7
        NEBULA_AMD64_SHA256: b748bd78b81e8a484ec7e35ad1c620807397c978780e8322d2148b87041e6525
        NEBULA_ARM64_SHA256: 009d98724cb430d911cdc53ea9e16373ff7f3d98ada82ec1c09796e6168cddac
        RESTIC_VERSION: 0.18.1
        RESTIC_AMD64_SHA256: 680838f19d67151adba227e1570cdd8af12c19cf1735783ed1ba928bc41f363d
        RESTIC_ARM64_SHA256: 87f53fddde38764095e9c058a3b31834052c37e5826d2acf34e18923c006bd45
      run: |
        mkdir thirdparty
        fetch() { # url, file, sha256
          curl -fsSL --retry 3 -o "thirdparty/$2" "$1"
          echo "$3  thirdparty/$2" | sha256sum -c --quiet - || { echo "::error::$2 does not match its pinned SHA-256"; exit 1; }
        }
        nebula="https://github.com/slackhq/nebula/releases/download/$NEBULA_VERSION"
        fetch "$nebula/nebula-linux-amd64.tar.gz" nebula-amd64.tar.gz "$NEBULA_AMD64_SHA256"
        fetch "$nebula/nebula-linux-arm64.tar.gz" nebula-arm64.tar.gz "$NEBULA_ARM64_SHA256"
        restic="https://github.com/restic/restic/releases/download/v$RESTIC_VERSION"
        fetch "$restic/restic_${RESTIC_VERSION}_linux_amd64.bz2" restic-amd64.bz2 "$RESTIC_AMD64_SHA256"
        fetch "$restic/restic_${RESTIC_VERSION}_linux_arm64.bz2" restic-arm64.bz2 "$RESTIC_ARM64_SHA256"
        mkdir thirdparty/amd64 thirdparty/arm64
        tar -xzf thirdparty/nebula-amd64.tar.gz -C thirdparty/amd64 nebula nebula-cert
        tar -xzf thirdparty/nebula-arm64.tar.gz -C thirdparty/arm64 nebula nebula-cert
        cp thirdparty/amd64/nebula nebula; cp thirdparty/amd64/nebula-cert nebula-cert
        cp thirdparty/arm64/nebula nebula-arm; cp thirdparty/arm64/nebula-cert nebula-arm-cert
        bunzip2 -c thirdparty/restic-amd64.bz2 > restic
        bunzip2 -c thirdparty/restic-arm64.bz2 > restic-arm
        chmod 755 nebula nebula-cert nebula-arm nebula-arm-cert restic restic-arm
        ./nebula -version; ./nebula-cert -version; ./restic version
        rm -rf thirdparty

    # package.json keeps upstream's version: the UI compares it with the
    # version an app from the market requires.
    - name: Build the UI
      shell: bash
      env:
        VITE_FORK_BUILD: ${{ inputs.build }}
      run: |
        npm ci --ignore-scripts --no-audit --no-fund
        npm run client-build

    - name: Test the fork's additions
      shell: bash
      env:
        # A release without a release key in it could never be updated again:
        # with this set, the test of the key slots fails when both are empty.
        FORK_REQUIRE_RELEASE_KEY: ${{ inputs.release == 'true' && '1' || '' }}
      run: |
        node --test "client/src/utils/*.test.mjs"
        node --test scripts/fork-deps-lib.test.mjs scripts/fork-deps-update.test.mjs scripts/fork-deps-ci.test.mjs scripts/fork-release-handover.test.mjs
        go test ./src/forkrelease/ -count=1
        cp src/update.go src/launcher/update.go && go test ./src/launcher/ -count=1 && rm src/launcher/update.go
        go test ./src/utils/ ./src/authorizationserver/ -count=1
        go test ./src/upnp/ ./src/configapi/ ./src/snapshots/ ./src/storage/ ./src/metrics/ ./src/user/ ./src/reach/ ./src/security/ ./src/telegram/ ./src/fail2ban/ ./src/maildetect/ ./src/dnsrecords/ ./src/cloudflare/... ./src/certs/ ./src/market/ ./src/turnstile/ ./src/edgeblock/ ./src/reachwatch/ ./src/anyimage/ ./src/behind/ ./src/appsignin/ ./src/cron/ -count=1
        go test ./src/ -skip TestEveryRouteIsDocumented -count=1
        go test ./src/docker/ -count=1
        go test ./src/proxy/ -count=1 # the live Avahi test in it skips without AVAHI_LIVE=1

    - name: Build the server and the launcher
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        RELEASE: ${{ inputs.release }}
      run: |
        # Both binaries read updateRepo (src/update.go): point it at this fork.
        export GOFLAGS="-ldflags=-X=main.updateRepo=$GITHUB_REPOSITORY"
        bash build.sh
        for f in cosmos cosmos-arm64 cosmos-launcher cosmos-launcher-arm64 static/index.html meta.json; do
          test -s "build/$f" || { echo "::error::build/$f is missing"; exit 1; }
        done
        grep -aq "$GITHUB_REPOSITORY" build/cosmos || { echo "::error::update source was not set in the binary"; exit 1; }
        grep -aq "$GITHUB_REPOSITORY" build/cosmos-launcher || { echo "::error::update source was not set in the launcher"; exit 1; }
        if [ "$RELEASE" = "true" ]; then
          # The server and the launcher each verify a release by themselves:
          # every release key of keys.go must be in every binary.
          keys=$(grep -oE '^[[:space:]]*"[A-Za-z0-9+/]{43}=",' src/forkrelease/keys.go | grep -oE '[A-Za-z0-9+/]{43}=' || true)
          if [ -z "$keys" ]; then echo "::error::src/forkrelease/keys.go holds no release key"; exit 1; fi
          for key in $keys; do
            for f in cosmos cosmos-arm64 cosmos-launcher cosmos-launcher-arm64; do
              grep -aqF "$key" "build/$f" || { echo "::error::build/$f does not carry a release key of keys.go"; exit 1; }
            done
          done
        fi
        if [ -n "$VERSION" ]; then
          # The server reads its version from meta.json and compares it with
          # the release tags when it looks for an update.
          upstream=$(jq -r .version build/meta.json)
          jq --arg v "$VERSION" --arg u "$upstream" --arg c "$GITHUB_SHA" \
            '.version = $v | .upstream = $u | .commit = $c' build/meta.json > build/meta.json.new
          mv build/meta.json.new build/meta.json
        fi
        cat build/meta.json

    # The server installs a release by itself, so nothing is released, and no
    # upstream merge reaches production, without having started at least once.
    - name: Start the build once
      shell: bash
      run: |
        rm -rf "$RUNNER_TEMP/smoke" "$RUNNER_TEMP/smoke-config"
        cp -r build "$RUNNER_TEMP/smoke"
        mkdir "$RUNNER_TEMP/smoke-config"
        cd "$RUNNER_TEMP/smoke"
        # start.sh runs the launcher before every start: a launcher that fails
        # with nothing to install would keep the server from starting at all
        if ! ./cosmos-launcher > "$RUNNER_TEMP/launcher.log" 2>&1; then
          cat "$RUNNER_TEMP/launcher.log"; echo "::error::The launcher failed with no update to install"; exit 1
        fi
        grep -q "No updates to install" "$RUNNER_TEMP/launcher.log" || { cat "$RUNNER_TEMP/launcher.log"; echo "::error::The launcher did not say it had nothing to install"; exit 1; }
        COSMOS_CONFIG_FOLDER="$RUNNER_TEMP/smoke-config/" COSMOS_HTTP_PORT=18080 COSMOS_HTTPS_PORT=18443 \
          ./cosmos > "$RUNNER_TEMP/smoke.log" 2>&1 &
        pid=$!

        code() { curl -s -o /dev/null -m 5 -w '%{http_code}' "http://127.0.0.1:18080$1" || true; }
        up=""
        for _ in $(seq 1 90); do
          if [ "$(code /cosmos-ui/)" = "200" ]; then up=1; break; fi
          kill -0 "$pid" 2>/dev/null || break
          sleep 1
        done
        ui=$(code /cosmos-ui/); api=$(code /cosmos/api/status); skin=$(code /cosmos-ui/skin/theme.css)
        kill "$pid" 2>/dev/null || true

        echo "ui=$ui api=$api skin=$skin"
        if [ -z "$up" ] || [ "$ui" != "200" ] || [ "$api" != "200" ] || [ "$skin" != "200" ]; then
          tail -n 60 "$RUNNER_TEMP/smoke.log"
          echo "::error::The build did not start and serve the UI"
          exit 1
        fi
        version=$(jq -r .version meta.json)
        if ! grep -qF "Starting Cosmos-Server version $version" "$RUNNER_TEMP/smoke.log"; then
          tail -n 60 "$RUNNER_TEMP/smoke.log"
          echo "::error::The build did not report version $version"
          exit 1
        fi
