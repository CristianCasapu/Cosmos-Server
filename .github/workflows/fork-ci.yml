# Fork addition: checks every push to `custom`, the development branch. Nothing
# is released from here; a commit reaches the server only once it is on
# `production` (see FORK.md).
name: Fork checks

on:
  push:
    branches: [custom]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to check; empty means the commit that started the run'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/fork-build
