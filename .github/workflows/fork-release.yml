# Fork addition: builds `production` and publishes it as a GitHub release in
# the layout Cosmos' own updater expects, so an install of this fork updates
# itself from here instead of from the original project. Only `production` is
# ever released (see FORK.md).
name: Fork release

on:
  push:
    branches: [production]
    # A release is installed by the server on its own, so do not cut one for
    # a push that only touches documentation.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The build runs third-party code (npm and Go dependencies). It gets no
      # token: checkout does not leave one on disk, and only the step that
      # publishes receives it. Actions are pinned to a commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # all tags, to number this build
          persist-credentials: false

      # A fork release is "<upstream version>-fork.<build>". The build number
      # counts every fork release and never restarts; the updater orders fork
      # releases by it alone (CompareVersions in src/update.go).
      - name: Work out the version
        id: version
        run: |
          if [ "$GITHUB_REF" != "refs/heads/production" ]; then
            echo "::error::Releases are built from production only, not from $GITHUB_REF"; exit 1
          fi

          released=$(git tag --points-at HEAD --list 'v*-fork.*' | head -n 1)
          if [ -n "$released" ]; then
            echo "::notice::This commit is already released as $released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          upstream=$(jq -r .version package.json)
          if ! [[ "$upstream" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot build on upstream version '$upstream' (not a stable x.y.z)"; exit 1
          fi

          build=3 # builds 1 to 3 were published as 0.23.4001 to 0.23.4003
          previous=""
          while read -r tag; do
            n=${tag##*-fork.}
            [[ "$n" =~ ^[0-9]{1,9}$ ]] || continue
            n=$((10#$n))
            if [ "$n" -gt "$build" ]; then build=$n; previous=$tag; fi
          done < <(git tag --list 'v*-fork.*')
          build=$((build + 1))

          version="$upstream-fork.$build"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Fork version $version (previous release: ${previous:-none})"

      - uses: ./.github/actions/fork-build
        if: steps.version.outputs.skip != 'true'
        with:
          version: ${{ steps.version.outputs.version }}
          build: ${{ steps.version.outputs.build }}

      - name: Package like upstream
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pkg="cosmos-cloud-$VERSION"

          mkdir "$pkg"
          cp -r build/* "$pkg/"
          rm "$pkg/cosmos-launcher-arm64" "$pkg/cosmos-arm64" "$pkg/nebula-arm" "$pkg/nebula-arm-cert" "$pkg/restic-arm"

          mkdir "$pkg-arm64"
          cp -r build/* "$pkg-arm64/"
          mv "$pkg-arm64/cosmos-arm64" "$pkg-arm64/cosmos"
          mv "$pkg-arm64/cosmos-launcher-arm64" "$pkg-arm64/cosmos-launcher"
          mv "$pkg-arm64/restic-arm" "$pkg-arm64/restic"

          zip -qr "$pkg-amd64.zip" "$pkg"
          zip -qr "$pkg-arm64.zip" "$pkg-arm64"
          md5sum "$pkg-amd64.zip" > "$pkg-amd64.zip.md5"
          md5sum "$pkg-arm64.zip" > "$pkg-arm64.zip.md5"
          ls -l cosmos-cloud-*.zip*

      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UPSTREAM: ${{ steps.version.outputs.upstream }}
          BUILD: ${{ steps.version.outputs.build }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Fork build $BUILD on top of upstream Cosmos $UPSTREAM (commit $GITHUB_SHA)."
            if [ -n "$PREVIOUS" ]; then
              echo
              echo "Changes since ${PREVIOUS#v}:"
              echo
              git log --no-merges --format='- %s' "$PREVIOUS..HEAD" | head -n 40
            fi
          } > notes.md
          gh release create "v$VERSION" \
            "cosmos-cloud-$VERSION-amd64.zip" "cosmos-cloud-$VERSION-amd64.zip.md5" \
            "cosmos-cloud-$VERSION-arm64.zip" "cosmos-cloud-$VERSION-arm64.zip.md5" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --latest \
            --notes-file notes.md
