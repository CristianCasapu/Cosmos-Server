# Fork addition: keeps the fork current with the original project. Once a day
# it merges upstream's latest stable release into `custom` and makes sure the
# head of `custom` has been released. If the merge cannot be made or pushed it
# changes nothing and opens an issue.
name: Sync with upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: azukaar/cosmos-server
  GH_TOKEN: ${{ github.token }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Nothing from the repository is executed in this job, only git and gh,
      # so the checkout may keep its credentials for the push below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: custom
          fetch-depth: 0

      - name: Merge the latest upstream release
        run: |
          report() { # title, body: open an issue unless the same one is already open
            if [ -z "$(gh issue list --state open --search "\"$1\" in:title" --json number --jq '.[].number')" ]; then
              gh issue create --title "$1" --body "$2"
            fi
          }

          # "latest" is the newest release that is neither a draft nor a
          # pre-release, so unstable upstream builds are never merged.
          latest=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)
          echo "Latest upstream release: $latest"

          git fetch --no-tags "https://github.com/$UPSTREAM_REPO.git" "refs/tags/$latest:refs/tags/$latest"

          if git merge-base --is-ancestor "$latest" HEAD; then
            echo "custom already contains $latest."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git merge --no-edit "$latest"; then
            conflicts=$(git diff --name-only --diff-filter=U)
            git merge --abort
            report "Upstream $latest does not merge cleanly into custom" \
              "$(printf 'The daily sync could not merge upstream release %s into `custom`.\n\nConflicting files:\n\n```\n%s\n```\n\nMerge it by hand (`git merge %s` on `custom`), resolve the conflicts and push; the push starts a fork release.' "$latest" "$conflicts" "$latest")"
            echo "::error::Merge of $latest conflicts in: $conflicts"
            exit 1
          fi

          # The workflow token may not push changes under .github/workflows, so
          # a merge that brings some is rejected here and needs a manual push.
          if ! git push origin HEAD:custom "refs/tags/$latest"; then
            report "Upstream $latest was merged but could not be pushed to custom" \
              "$(printf 'The daily sync merged upstream release %s cleanly but the push was rejected, most likely because the merge changes files under `.github/workflows`, which the workflow token may not push.\n\nRun `git merge %s` on `custom` yourself and push; the push starts a fork release.' "$latest" "$latest")"
            echo "::error::Push of the merge of $latest was rejected"
            exit 1
          fi

      # Pushes made with the workflow token do not trigger other workflows, so
      # the release is started from here. This runs on every sync, not only
      # after a merge, so a release that failed to start yesterday is retried.
      - name: Release the head of custom if it has not been released
        run: |
          git fetch --tags origin
          released=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$released" ] && git diff --quiet "$released" HEAD -- . ':(exclude)*.md'; then
            echo "The head of custom is already released as $released."
            exit 0
          fi
          echo "Starting a fork release (last release: ${released:-none})."
          gh workflow run fork-release.yml --ref custom
